spring:
  application:
    name: route-sync
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/routesync}
    username: ${DB_USER:routesync}
    password: ${DB_PASSWORD:routesync}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by Flyway

logging:
  structured:
    format:
      console: ecs # JSON logs; MDC keys (tenantId, correlationId) are included
