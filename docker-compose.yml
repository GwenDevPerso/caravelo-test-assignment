services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: routesync
      POSTGRES_USER: routesync
      POSTGRES_PASSWORD: routesync
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routesync -d routesync"]
      interval: 5s
      retries: 10

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/routesync
      DB_USER: routesync
      DB_PASSWORD: routesync
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
